<div class="dashboard-container">
  <h1>Feed de Adoção</h1>

  <div class="adoption-feed-container">
    <app-card *ngFor="let pet of pets" [pet]="pet" (cardClick)="selectPet(pet)" (adoptionStatusChanged)="handleAdoptionStatusChange($event)"></app-card>
    <div *ngIf="pets.length === 0" class="no-pets-message">
      <p>Nenhum pet disponível para adoção no momento.</p>
    </div>
  </div>
</div>
