<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="name" class="form-label">Nome do Produto:</label>
    <input type="text" id="name" formControlName="name" class="form-control">
    <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" class="text-danger">
      Nome é obrigatório.
    </div>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Descrição:</label>
    <textarea id="description" formControlName="description" class="form-control"></textarea>
    <div *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched" class="text-danger">
      Descrição é obrigatória.
    </div>
  </div>

  <div class="mb-3">
    <label for="price" class="form-label">Preço:</label>
    <input type="number" id="price" formControlName="price" class="form-control">
    <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched" class="text-danger">
      Preço é obrigatório e deve ser um número positivo.
    </div>
  </div>

  <!-- partnerId será preenchido automaticamente pelo componente pai -->

  <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">Salvar Produto</button>
</form>
