<ng-container *ngIf="isLoggedIn()">
<button class="btn btn-primary navbar-toggler navbar-dark position-fixed top-0 start-0 m-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
  <span class="navbar-toggler-icon"></span>
</button>

<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasExampleLabel">AdotaPet</h5>
    
  </div>
  <div class="offcanvas-body d-flex flex-column">
   <a class= "btn btn-primary mb-2" routerLink="/home" routerLinkActive="active">Home</a>
   <a class= "btn btn-primary" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
   
   <button class="btn btn-danger mt-auto w-100" (click)="logout()">Logout</button>
  </div>
</div>
</ng-container>
