<form [formGroup]="petForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="nome" class="form-label">Nome:</label>
    <input type="text" id="nome" formControlName="nome" class="form-control">
    <div *ngIf="petForm.get('nome')?.invalid && petForm.get('nome')?.touched" class="text-danger">
      Nome é obrigatório.
    </div>
  </div>

  <div class="mb-3">
    <label for="especie" class="form-label">Espécie:</label>
    <input type="text" id="especie" formControlName="especie" class="form-control">
    <div *ngIf="petForm.get('especie')?.invalid && petForm.get('especie')?.touched" class="text-danger">
      Espécie é obrigatória.
    </div>
  </div>

  <div class="mb-3">
    <label for="raca" class="form-label">Raça:</label>
    <input type="text" id="raca" formControlName="raca" class="form-control">
    <div *ngIf="petForm.get('raca')?.invalid && petForm.get('raca')?.touched" class="text-danger">
      Raça é obrigatória.
    </div>
  </div>

  <div class="mb-3">
    <label for="idade" class="form-label">Idade:</label>
    <input type="text" id="idade" formControlName="idade" class="form-control">
    <div *ngIf="petForm.get('idade')?.invalid && petForm.get('idade')?.touched" class="text-danger">
      Idade é obrigatória.
    </div>
  </div>

  <div class="mb-3">
    <label for="ong" class="form-label">ONG:</label>
    <input type="text" id="ong" formControlName="ong" class="form-control">
    <div *ngIf="petForm.get('ong')?.invalid && petForm.get('ong')?.touched" class="text-danger">
      ONG é obrigatória.
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Imagem do Pet:</label>
    <div class="image-selection-container">
      <button type="button" class="btn btn-secondary" (click)="openImageSelector()">Selecionar Imagem</button>
      <img *ngIf="selectedImage" [src]="'/assets/images/uploads/' + selectedImage" alt="Imagem selecionada" class="img-thumbnail mt-2" style="max-width: 150px;">
      <div *ngIf="petForm.get('img')?.invalid && petForm.get('img')?.touched" class="text-danger">
        A imagem é obrigatória.
      </div>
    </div>
  </div>

  <app-image-selector-modal *ngIf="showImageSelectorModal"
    (imageSelected)="onImageSelected($event)"
    (close)="closeImageSelector()">
  </app-image-selector-modal>

  <button type="submit" class="btn btn-primary" [disabled]="petForm.invalid">Salvar</button>
</form>
