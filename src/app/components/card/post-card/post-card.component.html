<div class="post-card" [ngClass]="'post-card-' + postOwnerType">
  <div class="post-card-header">
    <span class="post-owner-name">{{ postOwnerName }}</span>
  </div>
  <div class="post-image-container">
    <img [src]="imageUrl" [alt]="post.caption || 'Post image'">
  </div>
  <div class="post-content">
    <p *ngIf="post.caption">{{ post.caption }}</p>
    <div class="post-actions">
      <span (click)="onLikeClick()" [ngClass]="{'liked': hasLiked()}" style="cursor: pointer;">❤️ {{ post.likes }}</span>
      <div class="post-card-buttons" *ngIf="isMyPost()">
        <button class="btn btn-secondary btn-sm" (click)="onEditClick()">Editar</button>
        <button class="btn btn-danger btn-sm" (click)="openDeleteConfirmation()">Deletar</button>
      </div>
    </div>
  </div>
</div>

<app-confirmation-modal
  *ngIf="showConfirmationModal"
  [title]="'Confirmar Exclusão'"
  [message]="'Tem certeza que deseja excluir este post? Esta ação não pode ser desfeita.'"
  (confirm)="confirmDelete()"
  (close)="closeDeleteConfirmation()"
></app-confirmation-modal>
