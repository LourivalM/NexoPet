<div class="social-container">
  <h1>Feed Social</h1>
  <button (click)="toggleCreateForm()">Criar Novo Post</button>

  <app-create-post-form *ngIf="showCreateForm" (formSubmit)="handleFormSubmit($event)"></app-create-post-form>

  <div class="posts-list">
    <app-post-card *ngFor="let post of posts" [post]="post"></app-post-card>
  </div>
</div>
