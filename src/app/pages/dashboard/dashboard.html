<div class="dashboard-container">
  <h1>Adote Aqui</h1>

  <section class="d-flex gap-3 justify-content-around p-3" *ngIf="pets.length > 0">
    <!-- New horizontal pet list -->
    <div class="pet-list-horizontal">
      @for (p of pets; track p.id) {
        <div class="pet-badge" (click)="selectPet(p)">
          <img [src]="'/assets/images/uploads/' + p.img" [alt]="'Foto de ' + p.nome" [class.grayscale]="p.adoptionStatus === 'pending'">
          <div *ngIf="p.adoptionStatus === 'pending'" class="adoption-overlay">Em Processo de Adoção</div>
          <p>{{ p.nome }}</p>
        </div>
      }
    </div>
  </section>

  <section class="text-center mt-4" *ngIf="pets.length > 0">
    <div class="pet-detail-section">
      <app-pet-details [pet]="petSelected"></app-pet-details>

      <div class="mt-4">
        <button *ngIf="userType === 'ong'" class="btn btn-primary me-2" (click)="goToPetManagement()">Cadastrar Novo Pet</button>
        <button *ngIf="userType === 'pessoa' && petSelected.adoptionStatus !== 'pending'" class="btn btn-success" (click)="onAdoptClick()">Quero Adotar!</button>
        <button *ngIf="userType === 'pessoa' && petSelected.adoptionStatus === 'pending'" class="btn btn-warning" (click)="onCancelAdoptClick()">Cancelar Adoção</button>
      </div>
    </div>
  </section>

  <div *ngIf="pets.length === 0">
    <p>Nenhum pet disponível para adoção no momento.</p>
  </div>
</div>
