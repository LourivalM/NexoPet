<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">
      <img src="/img/NexoIMG/NexiPeticone logo fundo branco.png" alt="NexoPet Logo" class="header-logo-img">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn && user?.tipo === 'pessoa'">
          <a class="nav-link" routerLink="/social" routerLinkActive="active">Social</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        </li>
      </ul>
      <div class="d-flex align-items-center">
        <ng-container *ngIf="!isLoggedIn">
          <button class="btn btn-outline-primary me-2" (click)="toggleLoginForm()">Login</button>
          <button class="btn btn-primary" (click)="toggleRegisterSelection()">Cadastre-se</button>
        </ng-container>
        <ng-container *ngIf="isLoggedIn">
          <button class="btn-status-user me-2 d-flex align-items-center" (click)="onToggleSideMenu()">
            <span class="status-indicator me-1"></span>
            <span>{{ user?.nickname }}</span>
          </button>
          <button class="btn btn-danger" (click)="logout()">Logout</button>
        </ng-container>
      </div>
    </div>
  </div>
</nav>

<div *ngIf="showLoginForm" class="login-form-container" (click)="onContainerClick($event)">
  <app-login-form (loggedIn)="onLoggedIn()" (registerClicked)="toggleRegisterSelection()" (click)="$event.stopPropagation()"></app-login-form>
</div>

<app-register-selection *ngIf="showRegisterSelection" (closeSelection)="onCloseRegisterSelection()"></app-register-selection>
